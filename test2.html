<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body  > 
    <table border="1" width="500px" align="center" cellspacing="0" style="table-layout: fixed;" >

            <th colspan="6">Table</th>
        </tr>

        <tr>
            <th colspan="2">A</th>
            <th colspan="3">B</th>
            <th>C</th>
        </tr>

        <tr>
            <th rowspan="2" colspan="2">D</th>
            <th colspan="4">F</th>
        </tr>

        <tr>
            <th colspan="2">G</th>
            <th colspan="2">H</th>
        </tr>

        <tr>
            <th colspan="5">J</th>
            <th>I</th>
        </tr>

        <tr>
            <th colspan="2">K</th>
            <th>L</th>
            <th>M</th>
            <th rowspan="2" colspan="2">N</th>
        </tr>

        <tr>
            <th colspan="4">O</th>
        </tr>


    </table>
</body>
</html>
