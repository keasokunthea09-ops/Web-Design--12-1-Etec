<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form style="width: 400px; margin: auto; border: 2px solid black; padding: 20px; border-radius: 20px;">
        <h1>Student Registration Form</h1>

        <label >Full Name:</label>
        <input type="text"><br><br>

        <label >Email Address:</label>
        <input type="email"><br><br>

        <label >Date of Birth: </label>
        <input type="date"><br><br>

        <label >Gender:</label>
        <input type="radio" name="Female">
        <label >Female</label>

        <input type="radio" name="male">
        <label >Male</label><br><br>

        <label >Course</label>
        <select name="Course" id="">
            <optgroup>
                <option value="html">HTML</option>
            </optgroup>
        </select><br><br>

        <label >Skills You Have:</label><br>
        <input type="checkbox" value="html">
        <label >HTML</label><br>
        <input type="checkbox" value="CSS">
        <label >CSS</label><br>
        <input type="checkbox" value="JAVASCRIPT">
        <label >JAVASCRIPT</label><br><br>

        <label >Additional Comments:</label><br>
        <textarea style="height: 70px;" name="comments" placeholder="Enter your comments" ></textarea><br><br>

        <label >Upload your file:</label><br><br>

        <input style="border-radius: 5px;" type="file"></input>
        <br><br>

        <button type="reset" style="border-radius: 5px;"87>Upload</button><br><br>

        <button type="button" style="border-radius: 5px;">Register</button>
        <button type="submit" style="border-radius: 5px;">clear</button>
    </form>
</body>
</html>
