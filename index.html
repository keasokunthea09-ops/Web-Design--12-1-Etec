<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

</head>
<body>
    <form  action="" style="width: 400px; margin: auto; border: 2px solid brown; padding: 20px; border-radius: 10px; background-color: beige;">
        <h1 style="text-shadow: 1px 1px red, 2px 2px blue"><i>Register</i></h1>

        <label for="">First Name</label><br>
        <input type="text" name="first_name" placeholder="Enter FirstName"><br><br>

        <label for="">Last Name</label><br>
        <input type="text" name="last_name" placeholder="Enter LastName"><br><br>

        <label for="">Enter Email</label><br>
        <input type="email" placeholder="Enter Email"><br><br>

        <label for="">Enter Password</label><br>
        <input type="password" placeholder="Enter Password"><br><br>

        <label for="">Confirm Password</label><br>
        <input type="password" placeholder="Enter Password"><br><br>

        <label for="">Phone Number</label><br>
        <input type="text" placeholder="Enter PhoneNumber"><br><br>

        <input type="checkbox">
        <label for="">Do you want to remember me?</label><br><br>

        <button type="submit" style="background-color: gray; border-radius: 5px;">Register</button>
    
    </form>
</body>
</html>
