<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="/css/login-form/index.css">
</head>
<body>
    <form action="" class="form-login">
        <h1 class="text-login"><i>Login</i></h1>
        <p class="sub-title">Welcome back to our Webstore <br>
         Please Login for check, control, order ir buy anything.</p>

        <label class="label-input">Email</label><br>
        <input class="input-form" type="email" name="email" placeholder="Enter Email"><br><br><br>

        <label class="label-input">Password</label><br>
        <input class="input-form" type="password" placeholder="Enter Password"><br><br><br>

        <label class="label-input">Confirm Password</label><br>
        <input class="input-form" type="password" placeholder="Confirm Password"><br><br><br>

        <input type="checkbox">
        <label class="checkbox" >Remember me.</label><br><br><br>

        <button class="btn-sign">Login</button><br>

        <p class="sub-title">Don't have an account?</p>
    </form>
</body>
</html>
