<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework1</title>
</head>
<body>
    <form style="width: 300px; margin: auto; border: 2px solid brown; padding: 20px; border-radius: 30px;">
        <b>Personal Details</b><br><br>
        <label >Salutation:</label><br>
        <select name="--None--" >
            <optgroup >
                <option value="none">--None--</option>
            </optgroup>
        </select><br><br>

        <label  >First name:</label>
        <input type="text" placeholder="Firstname"><br><br>

        <label >Last name:</label>
        <input type="text" placeholder="Lastname"><br><br>

        <label >Gender :</label>
        <input type="radio" name="Male">
        <label >Male</label>
        <input type="radio" name="Female">
        <label >Female</label><br><br>

        <label >Email</label>
        <input type="email" required placeholder="Email"><br><br>

        <label >Date of Birth: </label>
        <input type="date"><br><br>

        <label >Address :</label><br>
        <textarea name="" id="" placeholder="Address"></textarea><br><br>

        <button type="submit" style="border-radius: 5px; color: gray;">Submit</button>


    </form>
</body>
</html>
