<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image:url(https://getwallpapers.com/wallpaper/full/b/9/3/1463601-full-size-4k-phone-wallpapers-3840x2160-hd-for-mobile.jpg);
            background-repeat:no-repeat ;
            background-size:cover ;
        }
        .form{
            width: 350px;
            margin:90px auto;
            border: 1px solid gray;
            border-radius: 20px;
            padding: 60px;
            background-color: rgba(114, 130, 145, 0.448);
        }

        .title-contact{
            color: rgb(235, 99, 14);
            font-size: 45px;
            text-align: center;
        }

         .sub-title{
            font-size: 25px;
            color: whitesmoke ;
            text-align: center;
        }

        .label-input{
            font-size: 25px;
            color: aliceblue;
        }

        .input-form{
            width: 98%;
            border: none;
            border-radius: 30px;
            font-size: 30px;
            font-style: initial;
            color: aliceblue;
            background-color: rgba(200, 225, 217, 0.245);
            box-shadow:0px 0px 8px  1px rgba(41, 78, 244, 0.773) inset;
            padding: 10px;
            
        }

        .textarea{
            height: 125px;
            width: 99%;
            color: aliceblue;
            background-color: rgba(207, 209, 229, 0.312);
            border-radius: 7px;
            box-shadow: 0px 0px 8px  1px rgba(41, 78, 244, 0.773) inset;
            font-size: 25px;
        }

        .box{
            width: 30px;
            height: 25px;
        }

        .checkbox{
            font-size: 25px;
        }


        .button-submit{
            width: 98%;
            height: 39px;
            border-radius: 7px;
            background-color: rgb(118, 130, 206);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <form action="" class="form">
        <h1 class="title-contact">Contact for more</h1>
        <p class="sub-title"><i>Please contact for more</i><br>
         Can contact if you have something to me.</p>

        <label class="label-input">First Name</label><br>
        <input class="input-form" type="text" name="name" placeholder="FirstName"><br><br>

        <label class="label-input">Last Name </label><br>
        <input class="input-form" type="text" name="last-name" placeholder="LastName"><br><br>

        <label class="label-input">Email</label><br>
        <input class="input-form" type="email" placeholder="Email Address" required><br><br>

        <label class="label-input">Phone Number</label><br>
        <input class="input-form" type="text" placeholder="PhoneNumber"><br><br>

        <label class="label-input">Additional Comments:</label><br>
        <textarea name="" class="textarea" placeholder="Enter your comments"></textarea><br><br>

        <input class="box" type="checkbox">
        <label class="checkbox" >Remember me.</label><br><br>

        <button class="button-submit">Send</button>

    </form>

</body>
</html>
