<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
</head>
<body>
    <form style="width: 300px; margin: auto; border: 2px solid black; padding: 15px; border-radius: 10px;">
        <h1 style="color: blue;"><i><u>Student Information</u></i></h1>

        <p>Enter Your Information</p>

        <label >Enter FullName</label><br>
        <input type="text" name="name" placeholder="Enter FullName"><br><br>

        <label >Enter Password</label><br>
        <input type="password" required placeholder="EnterPassword"><br><br>

        <label>Gender</label><br>
        <input type="checkbox" name="Male">
        <label for="">Male</label>

        <input type="checkbox" name="Female" >
        <label >Female</label><br><br>

        <label >Date of birth :</label>
        <input type="date" name="date"><br><br>

        <label >
            <h1 style="font-size: 20px;">Which one is your skill?</h1>
        </label>

        <input type="radio" name="Program" >
        <label >Program</label>

        <input type="radio" name="Network">
        <label >Network</label><br><br>

        <label >
            <h1 style="font-size: 20px;">Top off Tech-skill.</h1>
         </label>

        <label>C++ : 52%</label>
        <input type="range" value="C++"><br>

        <label >C : 50%</label>
        <input type="range" value="C"><br>

        <label >Java : 50%</label>
        <input type="range" value="Java" ><br><br>

        <button style="border-radius: 5px; background-color: aliceblue;">Submit</button>
        <button style="border-radius: 5px; background-color: aliceblue; ">Clear</button>
    </form>
</body>
</html>
